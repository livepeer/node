name: Publish Docker

# Release builds images and runs Go checks on main pushes.
# Consume only its successful main-push artifacts; registry writes stay here.
on:
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    environment: docker-publish
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      ghcr_digest: ${{ steps.publish.outputs.ghcr_digest }}
      dockerhub_digest: ${{ steps.publish.outputs.dockerhub_digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: docker-linux-*
          path: images
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested images and commit manifest
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ghcr_image="ghcr.io/$repository"
          dockerhub_image="docker.io/$repository"
          for arch in amd64 arm64; do
            docker load --input "images/docker-$arch.tar"
            test "$(docker image inspect --platform "linux/$arch" --format '{{.Os}}/{{.Architecture}}' "livepeer:test-$arch")" = "linux/$arch"
            test "$(docker image inspect --platform "linux/$arch" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "livepeer:test-$arch")" = "$COMMIT"
            for image in "$ghcr_image" "$dockerhub_image"; do
              docker tag "livepeer:test-$arch" "$image:sha-$COMMIT-$arch"
              docker push "$image:sha-$COMMIT-$arch"
            done
          done
          publish_manifest() {
            local registry=$1 image=$2 digest
            docker buildx imagetools create --tag "$image:sha-$COMMIT" \
              --metadata-file "$RUNNER_TEMP/$registry-manifest.json" \
              "$image:sha-$COMMIT-amd64" "$image:sha-$COMMIT-arm64"
            digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/$registry-manifest.json")
            docker buildx imagetools inspect --raw "$image@$digest" | \
              jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64", "linux/arm64"]'
            echo "${registry}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Published \`$image:sha-$COMMIT\` (\`$digest\`)." >> "$GITHUB_STEP_SUMMARY"
          }
          publish_manifest ghcr "$ghcr_image"
          publish_manifest dockerhub "$dockerhub_image"

  verify:
    name: Pull Linux ${{ matrix.arch }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    environment: docker-publish
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and run published image
        env:
          REPOSITORY: ${{ github.repository }}
          GHCR_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ needs.publish.outputs.dockerhub_digest }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          for reference in "ghcr.io/$repository@$GHCR_DIGEST" "docker.io/$repository@$DOCKERHUB_DIGEST"; do
            docker pull --platform "$PLATFORM" "$reference"
            version=$(docker image inspect --platform "$PLATFORM" --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$reference")
            test "$(docker run --rm --network none --platform "$PLATFORM" "$reference" version)" = "livepeer $version ($COMMIT)"
          done

  promote:
    needs: [publish, verify]
    runs-on: ubuntu-26.04
    environment: docker-publish
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Keep pending promotions: an older build may finish after the newest one.
    concurrency:
      group: docker-main-promotion
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          GHCR_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ needs.publish.outputs.dockerhub_digest }}
        run: |
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$COMMIT" ]]; then
            echo "Skipping main tag: $COMMIT is no longer the head of main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repository=$(printf '%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')
          for reference in "ghcr.io/$repository@$GHCR_DIGEST" "docker.io/$repository@$DOCKERHUB_DIGEST"; do
            image=${reference%@*}
            docker buildx imagetools create --tag "$image:main" "$reference"
            echo "Promoted \`$image:main\` to \`$COMMIT\` (\`$reference\`)." >> "$GITHUB_STEP_SUMMARY"
          done
