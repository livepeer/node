name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GO_RUNNER_SDK_DIR: ${{ runner.temp }}/golang-runner
      PYTHON_RUNNER_SDK_DIR: ${{ runner.temp }}/livepeer-python-gateway
      PYTHON_RUNNER_PYTHON: ${{ runner.temp }}/livepeer-python-gateway/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Pin Go Live Runner SDK fixture
        run: |
          git clone https://github.com/livepeer/golang-runner.git "$GO_RUNNER_SDK_DIR"
          git -C "$GO_RUNNER_SDK_DIR" checkout --detach c3be5a14a91f8a3437133419becaced324d804fe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Pin Python Live Runner SDK fixture
        run: |
          git clone https://github.com/livepeer/livepeer-python-gateway.git "$PYTHON_RUNNER_SDK_DIR"
          git -C "$PYTHON_RUNNER_SDK_DIR" checkout --detach 44df06157fcdb864e37d971e8caba86b2a7dc92e
          uv sync --project "$PYTHON_RUNNER_SDK_DIR" --locked --no-dev --python 3.12
      - name: Race and real-process tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Static release build
        run: CGO_ENABLED=0 go build ./...
