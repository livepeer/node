Listen = "127.0.0.1:8935"
MetricsListen = "127.0.0.1:8936"
ServiceURL = "http://127.0.0.1:8935"
# RunnerServiceURL = "http://127.0.0.1:8935" # Runner-facing callbacks and trickle; defaults to ServiceURL.
BootstrapSecretFile = "/run/secrets/livepeer-runner-bootstrap"
RunnerConfig = "/etc/livepeer/runners.toml"
# Use either registration method or both. Omit RunnerConfig for dynamic-only
# operation; omit BootstrapSecretFile for static-only operation.
HeartbeatInterval = "5s"
HeartbeatTTL = "30s"
RunnerGrants = []
SessionProxyGrants = []
HealthGrants = []
# ProxyURLTemplate = "https://{proxy}.apps.example" # Default: ServiceURL/run/{proxy}.

# Paid operation requires the database, key, RPC, chain ID, Controller, face
# value, winning probability, and exactly one conversion source below.
# Runner prices are USD per hour or per fixed request. Choose WeiPerUSD
# for a fixed conversion OR ETHUSDFeed for an ETH/USD feed on the payment
# chain. The fee ceiling and PriceMaxAge are optional. See docs/orchestrator.md.
# RedeemerDB = "/var/lib/livepeer/orchestrator-redeemer.sqlite"
# KeystoreFile = "/run/secrets/livepeer-orchestrator-keystore.json"
# KeystorePasswordFile = "/run/secrets/livepeer-orchestrator-keystore-password"
# Both files must be owner-only; the password is read as exact bytes (no newline).
# Or use LIVEPEER_ORCHESTRATOR_KEYSTORE_PASSWORD and omit KeystorePasswordFile.
# PaymentRPCURLFile = "/run/secrets/livepeer-payment-rpc-url"
# RedeemerMaxFeePerGas = "1000000000" # Optional ceiling, wei per gas
# PaymentChainID = 42161
# PaymentController = "0x0123456789abcdef0123456789abcdef01234567"
# WeiPerUSD = "1000000000000000"
# ETHUSDFeed = "0xYOUR_VERIFIED_ETH_USD_FEED"
# PriceMaxAge = "2h"
# Ticket EV is approximately 2e11 wei; a 100-ticket batch fits the signer
# default 2e13 wei cap. Fund sufficient deposit and recipient-claimable reserve.
# TicketFaceValue = "400000000000"
# TicketWinProb = "57896044618658097711785492504343953926634992332820282019728792003956564819967"
