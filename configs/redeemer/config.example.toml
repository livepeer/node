# Use a dedicated wallet that is neither registered nor active as an orchestrator.
Network = "arbitrum-one-mainnet"
Listen = "127.0.0.1:8941"
MetricsListen = "127.0.0.1:8942"
# DataDir = "/var/lib/livepeer/redeemer"
RedeemerDB = "tickets.sqlite"
# Account = "0xYOUR_DEDICATED_WALLET" # Select among shared keystore accounts.
KeystoreFile = "/run/secrets/livepeer-redeemer-keystore.json"
KeystorePasswordFile = "/run/secrets/livepeer-redeemer-password"
RPCURLFile = "/run/secrets/livepeer-rpc-url"
# Optional per-request authorization; sends request headers and the ticket.
# AuthWebhookFile = "/run/secrets/livepeer-redeemer-auth-url"
# AuthWebhookHeadersFile = "/run/secrets/livepeer-redeemer-auth-headers"
# Files containing credentials must be owner-only. Password bytes are exact.
# ChainID = 42161
# Controller = "0xD8E8328501E9645d16Cf49539efC04f734606ee4"
RedeemerTxTimeout = "5m"
RedeemerMaxTxReplacements = 1
# RedeemerMaxFeePerGas = "1000000000" # Optional ceiling, wei per gas.
MaxPendingTickets = 100000
MaxTicketsPerRecipient = 10000
